server {
    listen 8848 ssl http2;
    server_name tour.lingxiav.online;

    ssl_certificate     /etc/letsencrypt/live/tour.lingxiav.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tour.lingxiav.online/privkey.pem;

    root /var/www/lingshan-tourist;
    index index.html;

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

